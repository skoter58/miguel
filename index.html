<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CYBERGUARD - Plataforma de Ciberseguridad, Diagnóstico de Red y Análisis de Amenazas">
  <title>CYBERGUARD | Threat Diagnostic & Network Suite (Supabase RBAC)</title>

  <!-- REFORZAMIENTO DE SEGURIDAD (HTTPS & HEADERS) -->
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- FORZAR HTTPS EN CLIENTE -->
  <script>
    if (window.location.protocol === 'http:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      window.location.href = window.location.href.replace('http:', 'https:');
    }
  </script>

  <!-- SUPABASE JS SDK v2 (CDN OFICIAL DE ALTA SEGURIDAD) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Fuentes Futuristas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0d1322;
      --bg-card: rgba(21, 30, 49, 0.85);
      --border-cyan: #00f2fe;
      --border-red: #ff3366;
      --border-orange: #ff9900;
      --border-yellow: #ffcc00;
      --accent-green: #00ff88;
      --text-main: #f8fafc;
      --text-muted: #a0aec0;
      --glow-red: rgba(255, 51, 102, 0.4);
      --glow-orange: rgba(255, 153, 0, 0.4);
      --glow-cyan: rgba(0, 242, 254, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(255, 51, 102, 0.15) 0px, transparent 40%),
        radial-gradient(at 100% 0%, rgba(255, 153, 0, 0.15) 0px, transparent 40%),
        radial-gradient(at 50% 100%, rgba(0, 242, 254, 0.15) 0px, transparent 50%);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .pagina {
      width: min(1500px, calc(100% - 40px));
      margin: 0 auto;
      padding-bottom: 50px;
    }

    /* BARRA DE ALERTAS EN TIEMPO REAL */
    .threat-ticker {
      background: #070a14;
      border-bottom: 2px solid var(--border-red);
      box-shadow: 0 0 15px var(--glow-red);
      padding: 8px 0;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--border-orange);
      overflow: hidden;
      white-space: nowrap;
    }

    .ticker-content {
      display: inline-block;
      animation: ticker 35s linear infinite;
    }

    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* ENCABEZADO */
    header {
      margin-top: 15px;
      min-height: 90px;
      border: 1px solid var(--border-red);
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: rgba(21, 30, 49, 0.75);
      backdrop-filter: blur(16px);
      border-radius: 16px;
      box-shadow: 0 0 25px var(--glow-red);
      flex-wrap: wrap;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #ff3366 0%, #ff9900 50%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      font-size: 10px;
      padding: 3px 10px;
      background: rgba(255, 51, 102, 0.2);
      border: 1px solid var(--border-red);
      color: var(--border-red);
      border-radius: 20px;
      letter-spacing: 1px;
    }

    .user-status-box {
      display: none;
      align-items: center;
      gap: 12px;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--accent-green);
      padding: 8px 18px;
      border-radius: 30px;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
    }

    .user-status-box.active {
      display: flex;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulse 2s infinite;
    }

    .role-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      font-family: 'Fira Code', monospace;
    }

    .role-admin { background: rgba(255, 51, 102, 0.2); color: var(--border-red); border: 1px solid var(--border-red); }
    .role-supervisor { background: rgba(255, 153, 0, 0.2); color: var(--border-orange); border: 1px solid var(--border-orange); }
    .role-usuario { background: rgba(0, 242, 254, 0.2); color: var(--border-cyan); border: 1px solid var(--border-cyan); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #ff3366;
      color: #ff3366;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: #ff3366;
      color: #fff;
    }

    /* NAVEGACIÓN */
    nav {
      border: 1px solid var(--border-orange);
      min-height: 65px;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 25px;
      background: rgba(21, 30, 49, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 14px;
    }

    .menu-links {
      display: flex;
      list-style: none;
      gap: 12px;
      align-items: center;
    }

    .menu-links a, .btn-auth-trigger {
      display: block;
      padding: 9px 18px;
      text-decoration: none;
      color: var(--text-muted);
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .menu-links a:hover {
      color: var(--border-orange);
      border-color: var(--border-orange);
      background: rgba(255, 153, 0, 0.1);
      box-shadow: 0 0 15px var(--glow-orange);
    }

    .btn-auth-trigger {
      background: linear-gradient(135deg, rgba(255, 51, 102, 0.2), rgba(255, 153, 0, 0.2));
      border: 1px solid var(--border-red);
      color: var(--border-red);
      box-shadow: 0 0 15px var(--glow-red);
    }

    .btn-auth-trigger:hover {
      background: linear-gradient(135deg, var(--border-red), var(--border-orange));
      color: #fff;
      box-shadow: 0 0 25px var(--glow-red);
      transform: translateY(-2px);
    }

    /* HERO BLOCK / CANVAS 3D INTERACTIVO */
    main {
      margin-top: 20px;
    }

    .contenido-principal {
      border: 1px solid var(--border-cyan);
      min-height: 480px;
      padding: 30px;
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
      align-items: center;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .canvas-container {
      width: 100%;
      height: 400px;
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      position: relative;
      background: #070a14;
      box-shadow: inset 0 0 30px rgba(0, 242, 254, 0.2);
      overflow: hidden;
    }

    #cyberCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .canvas-overlay-text {
      position: absolute;
      bottom: 15px;
      left: 15px;
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      color: var(--border-orange);
      background: rgba(7, 10, 20, 0.85);
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid var(--border-orange);
      pointer-events: none;
    }

    .descripcion h1 {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .descripcion h1 span {
      background: linear-gradient(90deg, var(--border-red), var(--border-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .descripcion p {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .security-badges {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .badge-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-family: 'Fira Code', monospace;
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-orange);
      padding: 6px 14px;
      border-radius: 8px;
    }

    /* SEMÁFORO DE DIAGNÓSTICO */
    .seccion-semaforo {
      margin-top: 25px;
      border: 2px solid var(--border-red);
      padding: 30px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      box-shadow: 0 0 30px var(--glow-red);
    }

    .seccion-semaforo h2 {
      color: var(--text-main);
      font-size: 26px;
      margin-bottom: 20px;
      text-align: center;
    }

    .seccion-semaforo h2 span {
      color: var(--border-red);
    }

    .scanner-form {
      display: flex;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto 25px;
    }

    .scanner-form input, .tool-target-form input, .grupo-input select {
      flex: 1;
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid var(--border-cyan);
      background: rgba(7, 10, 20, 0.8);
      color: #fff;
      font-family: 'Fira Code', monospace;
      font-size: 14px;
      outline: none;
    }

    .scanner-form button, .tool-target-form button {
      padding: 14px 28px;
      background: linear-gradient(135deg, var(--border-red), var(--border-orange));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .scanner-form button:hover, .tool-target-form button:hover {
      box-shadow: 0 0 20px var(--glow-red);
      transform: translateY(-2px);
    }

    .semaforo-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 25px;
      align-items: center;
      background: rgba(7, 10, 20, 0.7);
      padding: 25px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .semaforo-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      background: #000;
      padding: 20px;
      border-radius: 40px;
      width: 110px;
      margin: 0 auto;
      border: 2px solid #333;
    }

    .luz {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      opacity: 0.2;
      transition: all 0.4s ease;
    }

    .luz.rojo { background-color: #ff3366; box-shadow: 0 0 20px #ff3366; }
    .luz.amarillo { background-color: #ffcc00; box-shadow: 0 0 20px #ffcc00; }
    .luz.verde { background-color: #00ff88; box-shadow: 0 0 20px #00ff88; }

    .luz.active { opacity: 1; }

    .scanner-details {
      font-family: 'Fira Code', monospace;
      font-size: 13px;
    }

    .scanner-details h3 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    /* SUITE DE HERRAMIENTAS DE DIAGNÓSTICO DE RED */
    .seccion-herramientas {
      margin-top: 25px;
      border: 1px solid var(--border-orange);
      padding: 35px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      position: relative;
    }

    .seccion-herramientas h2 {
      margin-bottom: 25px;
      color: var(--border-orange);
      font-size: 26px;
      text-align: center;
    }

    .tool-target-form {
      display: flex;
      gap: 12px;
      max-width: 800px;
      margin: 0 auto 20px;
    }

    .tools-nav {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .tool-tab {
      padding: 10px 20px;
      background: rgba(7, 10, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text-muted);
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tool-tab.active, .tool-tab:hover {
      border-color: var(--border-cyan);
      color: var(--border-cyan);
      background: rgba(0, 242, 254, 0.1);
    }

    .tool-console {
      background: #070a14;
      border: 1px solid var(--border-cyan);
      border-radius: 10px;
      padding: 20px;
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      min-height: 220px;
      color: var(--accent-green);
      overflow-y: auto;
    }

    /* RESTRICCIÓN DE ACCESO SEGÚN ROL (OVERLAY EN BLOQUES RESTRINGIDOS) */
    .role-restricted-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 10, 20, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      text-align: center;
      padding: 20px;
    }

    .role-restricted-overlay h3 {
      color: var(--border-red);
      font-size: 24px;
      margin-bottom: 10px;
    }

    .role-restricted-overlay p {
      color: var(--text-muted);
      font-size: 14px;
      max-width: 500px;
    }

    /* SECCIÓN EXCLUSIVA DE ADMINISTRADOR */
    .seccion-admin-panel {
      margin-top: 25px;
      border: 2px dashed var(--border-red);
      padding: 30px;
      background: rgba(255, 51, 102, 0.05);
      border-radius: 16px;
      display: none;
    }

    .seccion-admin-panel h2 {
      color: var(--border-red);
      font-size: 24px;
      margin-bottom: 15px;
    }

    /* 7 MÓDULOS DE SEGURIDAD */
    .seccion-modulos {
      margin-top: 25px;
      border: 1px solid var(--border-purple);
      padding: 35px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border-radius: 16px;
    }

    .seccion-modulos h2 {
      color: var(--text-main);
      font-size: 28px;
      margin-bottom: 25px;
      text-align: center;
    }

    .seccion-modulos h2 span {
      color: var(--border-cyan);
    }

    .grid-modulos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .modulo-card {
      background: rgba(7, 10, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 24px;
      transition: all 0.3s ease;
    }

    .modulo-card:hover {
      border-color: var(--border-orange);
      box-shadow: 0 0 25px var(--glow-orange);
      transform: translateY(-5px);
    }

    .modulo-card .modulo-num {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      color: var(--border-orange);
      margin-bottom: 8px;
    }

    .modulo-card h3 {
      color: var(--text-main);
      font-size: 18px;
      margin-bottom: 10px;
    }

    .modulo-card p {
      font-size: 13.5px;
      color: var(--text-muted);
    }

    /* GALERÍA DE OPERACIONES */
    .seccion-galeria {
      margin-top: 25px;
      border: 1px solid var(--border-cyan);
      padding: 35px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border-radius: 16px;
    }

    .seccion-galeria h2 {
      margin-bottom: 25px;
      color: var(--border-cyan);
      font-size: 26px;
      text-align: center;
    }

    .galeria-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .galeria-card {
      height: 220px;
      border: 1px solid var(--border-cyan);
      border-radius: 12px;
      overflow: hidden;
      background: #070a14;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
    }

    .galeria-card svg {
      width: 100%;
      height: 100%;
      transition: transform 0.4s ease;
    }

    .galeria-card:hover {
      border-color: var(--border-red);
      box-shadow: 0 0 25px var(--glow-red);
    }

    .galeria-card:hover svg {
      transform: scale(1.06);
    }

    .galeria-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px;
      background: rgba(7, 10, 20, 0.85);
      backdrop-filter: blur(6px);
      color: var(--border-yellow);
      font-size: 12px;
      font-weight: 700;
      font-family: 'Fira Code', monospace;
      text-align: center;
      border-top: 1px solid rgba(255, 204, 0, 0.3);
    }

    footer {
      margin-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 25px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }

    /* MODAL AUTENTICACIÓN */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(7, 10, 20, 0.9);
      backdrop-filter: blur(14px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-contenido {
      background: #111827;
      border: 1px solid var(--border-red);
      box-shadow: 0 0 35px var(--glow-red);
      border-radius: 16px;
      width: min(440px, 90%);
      padding: 30px;
      position: relative;
    }

    .cerrar-modal {
      position: absolute;
      top: 15px;
      right: 20px;
      color: var(--text-muted);
      font-size: 24px;
      cursor: pointer;
    }

    .tabs-auth {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      color: var(--border-red);
      border-bottom: 2px solid var(--border-red);
    }

    .form-auth {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .form-auth.active {
      display: flex;
    }

    .grupo-input {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .grupo-input label {
      font-size: 13px;
      color: var(--text-muted);
    }

    .grupo-input input, .grupo-input select {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(7, 10, 20, 0.8);
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .grupo-input input:focus, .grupo-input select:focus {
      border-color: var(--border-red);
      box-shadow: 0 0 10px var(--glow-red);
    }

    .btn-submit {
      margin-top: 10px;
      padding: 12px;
      background: linear-gradient(135deg, var(--border-red), var(--border-orange));
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .contenido-principal, .semaforo-grid, .galeria-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- TICKER DE SEGURIDAD -->
  <div class="threat
