<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Plataforma de Ciberseguridad, Tecnología e Innovación">
  <title>CYBERGUARD | Ciberseguridad & Innovación</title>

  <style>
    /* Reset global */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Fondo oscuro cibernético */
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #080d1a;
      background: radial-gradient(circle at top center, #0f172a 0%, #030712 100%);
      color: #94a3b8;
      line-height: 1.6;
      min-height: 100vh;
    }

    .pagina {
      width: min(1600px, calc(100% - 40px));
      margin: 20px auto;
    }

    /* Encabezado */
    header {
      min-height: 120px;
      border: 1px solid rgba(0, 242, 254, 0.3);
      padding: 20px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.15);
      flex-wrap: wrap;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
    }

    .subtitulo-header {
      color: #38ef7d;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Indicador de Usuario en el Header */
    .user-status-box {
      display: none;
      align-items: center;
      gap: 15px;
      background: rgba(56, 239, 125, 0.1);
      border: 1px solid #38ef7d;
      padding: 10px 18px;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(56, 239, 125, 0.2);
    }

    .user-status-box.active {
      display: flex;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #38ef7d;
      border-radius: 50%;
      box-shadow: 0 0 8px #38ef7d;
    }

    .user-info-text {
      font-size: 14px;
      color: #f8fafc;
    }

    .user-info-text span {
      color: #00f2fe;
      font-weight: 700;
    }

    .btn-logout {
      background: transparent;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-logout:hover {
      background: #ef4444;
      color: #ffffff;
    }

    /* Menú */
    nav {
      border: 1px solid rgba(0, 242, 254, 0.2);
      min-height: 70px;
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 30px;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(10px);
      border-radius: 12px;
    }

    .menu-titulo {
      font-size: 18px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 1px;
    }

    .menu-links {
      display: flex;
      list-style: none;
      gap: 12px;
      align-items: center;
    }

    .menu-links a, .btn-auth-trigger {
      display: block;
      padding: 10px 20px;
      text-decoration: none;
      color: #cbd5e1;
      border: 1px solid rgba(56, 239, 125, 0.3);
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.8);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .menu-links a:hover, .btn-auth-trigger:hover {
      background: #00f2fe;
      color: #030712;
      border-color: #00f2fe;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
      transform: translateY(-2px);
    }

    .btn-auth-trigger {
      background: rgba(0, 242, 254, 0.1);
      border-color: #00f2fe;
      color: #00f2fe;
    }

    /* Contenido principal */
    main {
      margin-top: 20px;
    }

    .contenido-principal {
      border: 1px solid rgba(0, 242, 254, 0.2);
      min-height: 500px;
      padding: 30px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
      align-items: center;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(8px);
      border-radius: 12px;
    }

      min-height: 400px;
      border: 1px solid
